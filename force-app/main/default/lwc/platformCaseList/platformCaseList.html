<template>
    <lightning-card title="Case Management" icon-name="standard:case">
        <div class="slds-m-around_medium">
            
            <!-- HEADER: FILTERS & ACTIONS -->
            <div class="slds-m-bottom_medium slds-grid slds-grid_align-spread slds-wrap">
                
                <!-- FILTER TABS -->
                <div class="slds-col">
                    <lightning-button-group>
                        <lightning-button label="My Assignments" variant={isMyAssignments} onclick={handleFilterChange} data-filter="MY_ASSIGNMENTS"></lightning-button>
                        <template if:true={isManager}>
                             <lightning-button label="Department Cases" variant={isDepartment} onclick={handleFilterChange} data-filter="DEPARTMENT"></lightning-button>
                        </template>
                        <lightning-button label="Created by Me" variant={isCreatedByMe} onclick={handleFilterChange} data-filter="CREATED_BY_ME"></lightning-button>
                    </lightning-button-group>
                </div>

                <!-- NEW CASE BUTTON -->
                <div class="slds-col">
                    <lightning-button 
                        label="New Case"
                        variant="brand"
                        onclick={openNewCaseModal}>
                    </lightning-button>
                </div>
            </div>

            <!-- SEARCH BAR -->
            <div class="slds-m-bottom_small">
                <lightning-input
                    type="search"
                    label="Search"
                    variant="label-hidden"
                    value={searchTerm}
                    placeholder="Search Cases..."
                    onkeyup={handleSearchChange}>
                </lightning-input>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- Error -->
            <template if:true={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>

            <!-- CASE TABLE (Custom HTML for Row Coloring) -->
            <template if:true={cases}>
                <div class="slds-table_header-fixed_container">
                    <div class="slds-scrollable_y" style="height:100%;">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    
                                    <!-- Case Number -->
                                    <th class="" scope="col">
                                        <a class="slds-th__action slds-text-link_reset" href="javascript:void(0);" role="button" tabindex="0" onclick={handleHeaderClick} data-field="CaseNumber">
                                            <span class="slds-assistive-text">Sort by: </span>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                                <span class="slds-truncate" title="Case Number">Case Number</span>
                                                <template if:true={isSortCaseNumber}>
                                                    <lightning-icon icon-name={sortIconName} size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                                                </template>
                                            </div>
                                        </a>
                                    </th>

                                    <!-- Subject -->
                                    <th class="" scope="col">
                                        <a class="slds-th__action slds-text-link_reset" href="javascript:void(0);" role="button" tabindex="0" onclick={handleHeaderClick} data-field="Subject">
                                            <span class="slds-assistive-text">Sort by: </span>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                                <span class="slds-truncate" title="Subject">Subject</span>
                                                <template if:true={isSortSubject}>
                                                     <lightning-icon icon-name={sortIconName} size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                                                </template>
                                            </div>
                                        </a>
                                    </th>

                                    <!-- Status -->
                                    <th class="" scope="col">
                                        <a class="slds-th__action slds-text-link_reset" href="javascript:void(0);" role="button" tabindex="0" onclick={handleHeaderClick} data-field="Status">
                                            <span class="slds-assistive-text">Sort by: </span>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                                <span class="slds-truncate" title="Status">Status</span>
                                                <template if:true={isSortStatus}>
                                                     <lightning-icon icon-name={sortIconName} size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                                                </template>
                                            </div>
                                        </a>
                                    </th>

                                    <!-- Priority -->
                                    <th class="" scope="col">
                                        <a class="slds-th__action slds-text-link_reset" href="javascript:void(0);" role="button" tabindex="0" onclick={handleHeaderClick} data-field="Priority">
                                            <span class="slds-assistive-text">Sort by: </span>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                                <span class="slds-truncate" title="Priority">Priority</span>
                                                <template if:true={isSortPriority}>
                                                     <lightning-icon icon-name={sortIconName} size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                                                </template>
                                            </div>
                                        </a>
                                    </th>

                                    <!-- Created Date -->
                                    <th class="" scope="col">
                                        <a class="slds-th__action slds-text-link_reset" href="javascript:void(0);" role="button" tabindex="0" onclick={handleHeaderClick} data-field="CreatedDate">
                                            <span class="slds-assistive-text">Sort by: </span>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                                <span class="slds-truncate" title="Created Date">Created Date</span>
                                                <template if:true={isSortDate}>
                                                     <lightning-icon icon-name={sortIconName} size="xx-small" class="slds-m-left_xx-small"></lightning-icon>
                                                </template>
                                            </div>
                                        </a>
                                    </th>

                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={cases} for:item="c">
                                    <tr key={c.Id} class={c.rowClass} onclick={handleRowClick} data-id={c.Id}>
                                        <td data-label="Case Number">
                                            <div class="slds-truncate" title={c.CaseNumber}>
                                                <a>{c.CaseNumber}</a>
                                            </div>
                                        </td>
                                        <td data-label="Subject">
                                            <div class="slds-truncate" title={c.Subject}>{c.Subject}</div>
                                        </td>
                                        <td data-label="Status">
                                            <div class="slds-truncate status-text" title={c.Status}>{c.Status}</div>
                                        </td>
                                        <td data-label="Priority">
                                            <div class="slds-truncate" title={c.Priority}>
                                                <template for:each={c.priorityLoop} for:item="p">
                                                    <span key={p} class={c.priorityClass}>!</span>
                                                </template>
                                            </div>
                                        </td>
                                        <td data-label="Created Date">
                                            <div class="slds-truncate" title={c.CreatedDate}>
                                                <lightning-formatted-date-time value={c.CreatedDate} year="numeric" month="numeric" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination Controls -->
                <div class="slds-m-top_small slds-grid slds-grid_align-spread">
                    <lightning-button 
                        label="Previous" 
                        onclick={handlePrevious}
                        disabled={isFirstPage}>
                    </lightning-button>

                    <div>
                        Page {pageNumber} of {totalPages}<br/>
                        Total Cases: {totalRecords}
                    </div>

                    <lightning-button 
                        label="Next" 
                        onclick={handleNext}
                        disabled={isLastPage}>
                    </lightning-button>
                </div>
            </template>

        </div>
    </lightning-card>

    <!-- ===================================== -->
    <!--              NEW CASE MODAL           -->
    <!-- ===================================== -->
    <template if:true={showNewCaseModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- HEADER -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeNewCaseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">New Case</h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">

                    <!-- CONTACT LOOKUP -->
                    <div class="lookup-container slds-m-top_medium">
                        <lightning-input
                            label="Contact Name"
                            value={contactSearchTerm}
                            onchange={handleContactSearchChange}
                            placeholder="Search Contacts..."
                            class="lookup-input">
                        </lightning-input>

                        <template if:true={contactResultsVisible}>
                            <div class="lookup-dropdown">
                                <template for:each={contactOptions} for:item="c">
                                    <div 
                                        key={c.value}
                                        class="lookup-option"
                                        data-id={c.value}
                                        data-name={c.label}
                                        onclick={handleContactSelect}>
                                        {c.label}
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- CASE FIELDS -->
                    <!-- Status, Origin, Account REMOVED per request -->

                    <lightning-combobox
                        class="slds-m-top_medium"
                        label="Priority"
                        value={newCasePriority}
                        options={priorityOptions}
                        onchange={handleFieldChange}
                        data-field="Priority">
                    </lightning-combobox>

                    <lightning-combobox
                        class="slds-m-top_medium"
                        label="Case Reason"
                        value={newCaseReason}
                        options={reasonOptions}
                        onchange={handleFieldChange}
                        data-field="Reason">
                    </lightning-combobox>

                    <lightning-combobox
                        class="slds-m-top_medium"
                        label="Type"
                        value={newCaseType}
                        options={typeOptions}
                        onchange={handleFieldChange}
                        data-field="Type">
                    </lightning-combobox>

                    <lightning-input
                        class="slds-m-top_medium"
                        label="Subject"
                        value={newCaseSubject}
                        onchange={handleSubjectChange}>
                    </lightning-input>

                    <lightning-textarea
                        class="description-box slds-m-top_medium"
                        label="Description"
                        value={newCaseDescription}
                        onchange={handleDescriptionChange}
                        rows="10">
                    </lightning-textarea>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer">
                    <lightning-button 
                        label="Cancel" 
                        onclick={closeNewCaseModal}>
                    </lightning-button>

                    <lightning-button 
                        class="slds-m-left_small" 
                        variant="brand" 
                        label="Create Case" 
                        onclick={handleCreateCase}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
