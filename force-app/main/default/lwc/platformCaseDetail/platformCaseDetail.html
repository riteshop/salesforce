<template>
    <lightning-card title="Case Details" icon-name="standard:case">
        <div class="slds-p-around_medium">

            <!-- LOADING -->
            <template if:true={isLoading}>
                <lightning-spinner></lightning-spinner>
            </template>

                <!-- ================================================= -->
                <!-- DEBUG INFO (REMOVE LATER) -->
                <!-- ================================================= -->
                <template if:false={caseRecord}>
                    <div class="slds-box slds-theme_warning slds-m-bottom_medium">
                         <h3 class="slds-text-heading_small">Debug Info</h3>
                         <p><strong>Case ID:</strong> {caseId}</p>
                         <p><strong>Is Loading:</strong> {isLoading}</p>
                         <p><strong>Error Type:</strong> {error}</p>
                         <p>If you see this, the Case Record failed to load.</p>
                    </div>
                </template>

                <template if:true={caseRecord}>

                <!-- ================================================= -->
                <!-- WORKFLOW ACTIONS (NEW) -->
                <!-- ================================================= -->
                <lightning-card title="Actions" icon-name="action:change_owner" class="slds-m-bottom_medium">
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                        
                        <!-- MANAGER VIEW: Assign from Queue -->
                        <template if:true={showAssignmentPanel}>
                            <div class="slds-box slds-theme_shade">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Manager Assignment</h3>
                                <div class="slds-grid slds-gutters slds-grid_vertical-align-end">
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-combobox
                                            label="Assign To"
                                            value={selectedAssignee}
                                            options={userOptions}
                                            onchange={handleAssigneeChange}>
                                        </lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-grow-none">
                                        <lightning-input 
                                            type="checkbox" 
                                            label="Requires Manager Review" 
                                            checked={requiresReview}
                                            onchange={handleReviewChange}>
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col">
                                        <lightning-button 
                                            variant="brand" 
                                            label="Assign Case" 
                                            onclick={handleAssign}
                                            disabled={isSaving}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- ASSIGNEE VIEW: Submit Work -->
                        <template if:true={isInProgress}>
                            <div class="slds-box slds-theme_shade">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Submit Work</h3>
                                <p class="slds-m-bottom_small">When you are finished with this request, click Submit.</p>
                                <lightning-button 
                                    variant="brand" 
                                    label="Submit Case" 
                                    onclick={handleSubmit}
                                    disabled={isSaving}>
                                </lightning-button>
                            </div>
                        </template>

                        <!-- REVIEWER VIEW: Approve / Reject -->
                        <template if:true={isReviewing}>
                            <div class="slds-box slds-theme_shade">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Manager Review</h3>
                                <p class="slds-m-bottom_small">This case is waiting for your review.</p>
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col">
                                        <lightning-button 
                                            variant="success" 
                                            label="Approve & Close" 
                                            onclick={handleApprove}
                                            class="slds-m-right_small"
                                            disabled={isSaving}>
                                        </lightning-button>
                                        <lightning-button 
                                            variant="destructive-text" 
                                            label="Reject (Return)" 
                                            onclick={handleReject}
                                            disabled={isSaving}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- COMPLETED VIEW -->
                        <template if:false={showAssignmentPanel}>
                             <template if:false={isInProgress}>
                                <template if:false={isReviewing}>
                                    <p class="slds-text-color_weak slds-text-align_center">
                                        <i>This case is {caseRecord.Status}. No actions available.</i>
                                    </p>
                                </template>
                             </template>
                        </template>

                    </div>
                </lightning-card>

                <!-- ================================================= -->
                <!-- CASE INFORMATION -->
                <!-- ================================================= -->
                <!-- ================================================= -->
                <!-- CASE INFORMATION -->
                <!-- ================================================= -->
                <h2 class="section-header">Case Information</h2>

                <div class="slds-grid slds-gutters">
                    <div class="slds-col">
                        <p><strong>Case Number:</strong> {caseRecord.CaseNumber}</p>
                        <p><strong>Status:</strong> {caseRecord.Status}</p>
                        <p><strong>Account:</strong> {accountName}</p>
                        <p><strong>Contact:</strong> {contactName}</p>
                    </div>
                    <div class="slds-col">
                         <p><strong>Owner:</strong> {caseRecord.OwnerName}</p>
                         <p><strong>Assigned To:</strong> {assignedUserName}</p>
                         <p><strong>Manager:</strong> {managerName}</p>
                         <p><strong>Created By:</strong> {caseRecord.CaseCreatorName}</p>
                         <p><strong>Employee:</strong> {employeeName}</p>
                    </div>
                </div>

                <hr class="slds-m-vertical_medium" />

                <!-- ================================================= -->
                <!-- WORKFLOW ACTIONS -->
                <!-- ================================================= -->
                <!-- (See below, already in correct place relative to details, just need to move Email later) -->

                <!-- [Action: Moving Email Composer to Bottom] -->

                <!-- ================================================= -->
                <!-- CASE DETAILS -->
                <!-- ================================================= -->
                <h2 class="section-header">Case Details</h2>

                <lightning-input
                    label="Subject"
                    value={caseRecord.Subject}
                    data-field="Subject"
                    onchange={handleChange}>
                </lightning-input>

                <lightning-textarea
                    class="description-box"
                    label="Description"
                    value={caseRecord.Description}
                    data-field="Description"
                    onchange={handleChange}>
                </lightning-textarea>

                <lightning-combobox
                    label="Status"
                    data-field="Status"
                    value={caseRecord.Status}
                    options={statusOptions}
                    class="slds-m-top_medium"
                    onchange={handleChange}>
                </lightning-combobox>

                <lightning-combobox
                    label="Priority"
                    data-field="Priority"
                    value={caseRecord.Priority}
                    options={priorityOptions}
                    class="slds-m-top_medium"
                    onchange={handleChange}>
                </lightning-combobox>

                <lightning-combobox
                    label="Type"
                    data-field="Type"
                    value={caseRecord.Type}
                    options={typeOptions}
                    class="slds-m-top_medium"
                    onchange={handleChange}>
                </lightning-combobox>

                <lightning-combobox
                    label="Case Reason"
                    data-field="Reason"
                    value={caseRecord.Reason}
                    options={reasonOptions}
                    class="slds-m-top_medium"
                    onchange={handleChange}>
                </lightning-combobox>

                <!-- OWNER LOOKUP -->
                <div class="slds-m-top_medium">
                    <label class="slds-form-element__label">Owner</label>

                    <div class="lookup-container">
                        <input 
                            type="text"
                            class="lookup-input"
                            value={ownerSearchTerm}
                            oninput={handleOwnerTyping}
                            placeholder="Search owner..."
                        />

                        <template if:true={showOwnerDropdown}>
                            <ul class="lookup-dropdown">
                                <template for:each={ownerSearchResults} for:item="o">
                                    <li 
                                        key={o.value}
                                        class="lookup-option"
                                        data-id={o.value}
                                        data-label={o.label}
                                        onclick={handleOwnerSelect}>
                                        {o.label}
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </div>

                <div class="slds-m-top_large">
                    <lightning-button label="Back" onclick={goBack}></lightning-button>

                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label="Save"
                        onclick={saveCase}>
                    </lightning-button>

                    <template if:true={isSaving}>
                        <lightning-spinner size="small" class="slds-m-left_small"></lightning-spinner>
                    </template>
                </div>

                <hr class="slds-m-vertical_large" />

                <!-- ================================================= -->
                <!-- CASE HISTORY -->
                <!-- ================================================= -->
                <h2 class="section-header">Case History</h2>

                <template if:true={isLoadingCaseHistory}>
                    <lightning-spinner size="small"></lightning-spinner>
                </template>

                <template for:each={caseHistoryEntries} for:item="entry">
                    <article key={entry.sourceId} class="email-card slds-box slds-m-bottom_small">

                        <div class="slds-grid slds-grid_align-spread">
                            <div>
                                <strong>{entry.title}</strong>
                                <div class="slds-text-body_small">
                                    {entry.typeLabel} • {entry.createdByName}
                                </div>
                            </div>

                            <lightning-formatted-date-time
                                class="slds-text-body_small"
                                value={entry.createdDate}
                                year="numeric"
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit">
                            </lightning-formatted-date-time>
                        </div>

                        <pre class="email-body">{entry.body}</pre>

                    </article>
                </template>

                <hr class="slds-m-vertical_large" />

                <!-- ================================================= -->
                <!-- EMAIL COMPOSER -->
                <!-- ================================================= -->
                <h2 class="section-header">Send Email</h2>

                <div class="slds-m-top_small">
                    <label class="slds-form-element__label">Send From</label>
                    <div class="address-row">
                        <select
                            class="address-select"
                            value={selectedFromAddress}
                            onchange={handleFromAddressChange}>
                            <template for:each={fromAddressOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>
                                    {opt.label}
                                </option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="slds-m-top_small">
                    <label class="slds-form-element__label">To</label>
                    <div class="address-row">
                        <template for:each={emailToList} for:item="addr">
                            <lightning-pill
                                key={addr}
                                name={addr}
                                label={addr}
                                onremove={removeTo}>
                            </lightning-pill>
                        </template>

                        <lightning-input
                            class="address-input"
                            variant="label-hidden"
                            placeholder="Add recipient"
                            value={emailToInput}
                            onchange={handleToInputChange}
                            onkeydown={handleToKeydown}>
                        </lightning-input>
                    </div>
                </div>

                <div class="slds-m-top_small">
                    <lightning-button
                        variant="base"
                        label={ccBccButtonLabel}
                        onclick={toggleCcBcc}>
                    </lightning-button>
                </div>

                <template if:true={showCcBcc}>
                    <div class="slds-m-top_small">
                        <label class="slds-form-element__label">CC</label>
                        <div class="address-row">
                            <template for:each={emailCCList} for:item="addr">
                                <lightning-pill
                                    key={addr}
                                    name={addr}
                                    label={addr}
                                    onremove={removeCC}>
                                </lightning-pill>
                            </template>
                            <lightning-input
                                class="address-input"
                                variant="label-hidden"
                                placeholder="Add CC"
                                value={emailCCInput}
                                onchange={handleCCInputChange}
                                onkeydown={handleCCKeydown}>
                            </lightning-input>
                        </div>
                    </div>

                    <div class="slds-m-top_small">
                        <label class="slds-form-element__label">BCC</label>
                        <div class="address-row">
                            <template for:each={emailBCCList} for:item="addr">
                                <lightning-pill
                                    key={addr}
                                    name={addr}
                                    label={addr}
                                    onremove={removeBCC}>
                                </lightning-pill>
                            </template>
                            <lightning-input
                                class="address-input"
                                variant="label-hidden"
                                placeholder="Add BCC"
                                value={emailBCCInput}
                                onchange={handleBCCInputChange}
                                onkeydown={handleBCCKeydown}>
                            </lightning-input>
                        </div>
                    </div>
                </template>

                <div class="slds-m-top_small">
                    <label class="slds-form-element__label">Subject</label>
                    <div class="address-row">
                        <input
                            type="text"
                            class="address-plain-input"
                            placeholder="Email subject"
                            value={emailSubject}
                            onchange={handleEmailSubjectChange} />
                    </div>
                </div>

                <div class="slds-m-top_small">
                    <label class="slds-form-element__label">Body</label>
                    <div class="address-row address-row-textarea">
                        <textarea
                            class="address-textarea"
                            placeholder="Write your message..."
                            value={emailBody}
                            onchange={handleEmailBodyChange}>
                        </textarea>
                    </div>
                </div>

                <div class="slds-m-top_small">
                    <lightning-button
                        variant="brand"
                        label="Send Email"
                        onclick={handleSendEmail}
                        disabled={isSendDisabled}>
                    </lightning-button>
                </div>

                <hr class="slds-m-vertical_large" />

                <!-- ================================================= -->
                <!-- EMAIL HISTORY -->
                <!-- ================================================= -->
                <h2 class="section-header">Email History</h2>

                <template for:each={emailEntries} for:item="msg">
                    <article key={msg.Id} class={msg.bubbleClass}>

                        <div class="slds-grid slds-grid_align-spread">
                            <div>
                                <strong>{msg.Subject}</strong>
                                <lightning-badge label={msg.directionLabel}
                                                 class="slds-m-top_xx-small">
                                </lightning-badge>

                                <p class="slds-text-body_small wrap-text">
                                    <b>From:</b> {msg.FromAddress}<br />
                                    <b>To:</b> {msg.ToAddress}
                                </p>

                                <template if:true={msg.CcAddress}>
                                    <p class="slds-text-body_small wrap-text">
                                        <b>CC:</b> {msg.CcAddress}
                                    </p>
                                </template>
                            </div>

                            <lightning-formatted-date-time
                                value={msg.CreatedDate}
                                class="slds-text-body_small"
                                year="numeric"
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit">
                            </lightning-formatted-date-time>
                        </div>

                        <pre class="email-body wrap-text">{msg.TextBody}</pre>

                    </article>
                </template>

            </template>
        </div>
    </lightning-card>
</template>
